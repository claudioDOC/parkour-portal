android.useAndroidX=true

# Auf 2 GB RAM abgestimmt: Heap klein halten, keine parallelen Worker und kein
# Daemon, der zwischen den Läufen Speicher belegt. Auf einer grösseren Maschine
# (oder in der CI) darf das gerne höher.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=2
